[project]
name = "bilibili-subtitles"
version = "0.1.0"
description = "Extract authorized Bilibili subtitle tracks locally and format readable transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "FLH20" }
]
dependencies = [
  "yt-dlp==2026.7.4"
]
keywords = ["bilibili", "subtitles", "transcript", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video"
]

[project.urls]
Homepage = "https://github.com/Diorvh/codex-bilibili-subtitles#readme"
Repository = "https://github.com/Diorvh/codex-bilibili-subtitles"
Issues = "https://github.com/Diorvh/codex-bilibili-subtitles/issues"

[tool.unittest]
start-directory = "tests"
